<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Result</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 1000px;
      background: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 16px rgba(0,0,0,0.15);
      position: relative;
    }

    .card h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #007bff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: #dc3545;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .back-btn:hover {
      background: #a71d2a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div class="card">
  <a href="/" class="back-btn">⬅ Back</a>
  <h3>Search Result</h3>
  {%if data  %}
    <table>
    <thead>
      <tr>
        {% for heading in data[0].split(",") %}
          <th>{{ heading }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in data[1:21] %}
      <tr>
        {% for cell in row.split(",") %}
          <td>{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>

  </table>
  {%else%}
  <h3 style="color:red; align-content: center;">No data found</h3>
  {% endif %}
  
</div>

</body>
</html>
