<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualization Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    /* Stylish Header */
    .page-header {
      text-align: center;
      font-size: 40px;
      font-weight: bold;
      background: linear-gradient(90deg, #6a11cb, #2575fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 40px;
      position: relative;
      display: inline-block;
      left: 50%;
      transform: translateX(-50%);
    }

    .page-header::after {
      content: '';
      display: block;
      margin: 10px auto 0;
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, #6a11cb, #2575fc);
      border-radius: 2px;
    }

    /* Cards */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
    width: 100%;
    height: 180px;
    object-fit: contain; /* Fit entire image */
    background-color: #f9f9f9; /* Adds a subtle background */
    padding: 10px; /* Creates spacing around image */
    border-bottom: 1px solid #eee; /* Neat separation */
  }
    .card-title {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color: #444;
    }
  </style>
</head>
<body>

  <h1 class="page-header">Visualization Dashboard</h1>
    {%if data%}
  <div class="card-container">
    <div class="card">
      <img src="/static/image.png" alt="Visualization 1">
      <div class="card-title">Rating vs Counts of companies</div>
    </div>
    <div class="card">
      <img src="/static/image2.png" alt="Visualization 2">
      <div class="card-title">Companies age vs Counts of Companies</div>
    </div>
    
  </div>
{%else%}
  <h3 style="color:red; align-content: center;">No data found</h3>
        
    {%endif %}
</body>
</html>
